name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      # This step goes through the poethepoet task defined in pyproject.toml,
      # so CI and a developer machine run the same command definitions and
      # cannot drift. `uv sync --all-groups` above installs poethepoet from the
      # dev group; `--frozen` is supplied by the UV_FROZEN=1 in [tool.poe.env].
      - name: Run tests with coverage
        run: uv run poe test-cov

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # Its own job, not a step inside the 3.12 matrix leg. As a step it queued
  # behind a full coverage run, so a one-line pylint error took the whole suite
  # to report; as a job it runs concurrently and fails in about the time it
  # takes to install. `poe check` runs the same two tasks in parallel locally,
  # but CI wants them as two independently reportable checks rather than one
  # combined pass/fail.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run static checks
        run: uv run poe lint

# Note: a previous draft of this workflow included a `windows-verify` job
# that ran `python scripts/build_production.py --verify --no-launch` on
# `windows-latest`. That job cannot succeed on the GitHub-hosted runner:
# the `windows-latest` image does not include Microsoft Office, so
# xlwings fails to dispatch `Excel.Application` with
# `pywintypes.com_error: (-2147221005, 'Invalid class string')`.
# The spec-driven verifier is still runnable on a developer machine via
# `poe verify-deep` (or `python scripts/build_production.py --verify --no-launch`)
# (see CONTRIBUTING.md → *Verifying builds*); it just has no CI home until
# a self-hosted runner with Office is wired in.
