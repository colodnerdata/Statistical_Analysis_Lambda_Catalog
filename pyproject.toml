[project]
name = "statistical-analysis-lambda-catalog"
version = "0.1.0"
description = "Generate an Excel lambda-function catalog for multilinear regression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lxml",
  "numpy",
  "pywin32",
  "statsmodels",
  "xlwings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lambda_catalog"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.main]
extension-pkg-allow-list = ["lxml"]
