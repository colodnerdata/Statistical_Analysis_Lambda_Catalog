name: Fix PR 240 catalog counts

on:
  push:
    branches:
      - refactor/log-drop-sample-mask

permissions:
  contents: write

jobs:
  fix-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/log-drop-sample-mask
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update documented catalog counts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'README.md',
              'all 151 LAMBDA definitions (127 workbook-scoped and shared by every sheet, plus 24 sheet-scoped template constructors)',
              'all 152 LAMBDA definitions (127 workbook-scoped and shared by every sheet, plus 25 sheet-scoped template constructors)',
          )
          replace_exact(
              'README.md',
              "the Regression sheet's 24 Regression-scoped definitions",
              "the Regression sheet's 25 Regression-scoped definitions",
          )
          replace_exact(
              'README.md',
              'the shared catalog of 151 LAMBDA definitions',
              'the shared catalog of 152 LAMBDA definitions',
          )
          replace_exact(
              'README.md',
              'all 151 LAMBDA definitions (127 workbook-scoped plus 24 sheet-scoped template constructors)',
              'all 152 LAMBDA definitions (127 workbook-scoped plus 25 sheet-scoped template constructors)',
          )
          replace_exact(
              'CONTRIBUTING.md',
              'All 151 LAMBDA definitions are written into the Name Manager.',
              'All 152 LAMBDA definitions are written into the Name Manager.',
          )
          PY
      - name: Verify catalog-count tests
        run: |
          python -m pip install -q -e . pytest
          pytest -q tests/test_doc_catalog_counts.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-pr240-ci-counts.yml
          git add README.md CONTRIBUTING.md
          git commit -m "Update documented catalog counts"
          git push origin HEAD:refactor/log-drop-sample-mask
