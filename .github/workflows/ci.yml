name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run tests with coverage
        run: uv run --frozen pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Run static checks
        if: matrix.python-version == '3.12'
        run: uv run --frozen pylint --errors-only lambda_catalog scripts tools

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

# Note: a previous draft of this workflow included a `windows-verify` job
# that ran `python scripts/build_production.py --verify --no-launch` on
# `windows-latest`. That job cannot succeed on the GitHub-hosted runner:
# the `windows-latest` image does not include Microsoft Office, so
# xlwings fails to dispatch `Excel.Application` with
# `pywintypes.com_error: (-2147221005, 'Invalid class string')`.
# The spec-driven verifier is still runnable on a developer machine via
# `python scripts/build_production.py --verify --no-launch`
# (see CONTRIBUTING.md → *Verifying builds*); it just has no CI home until
# a self-hosted runner with Office is wired in.
