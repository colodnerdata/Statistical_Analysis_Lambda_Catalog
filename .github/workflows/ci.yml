name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run tests with coverage
        run: uv run --frozen pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Run static checks
        if: matrix.python-version == '3.12'
        run: uv run --frozen pylint --errors-only lambda_catalog build_production.py build_qc.py tools

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  windows-verify:
    name: Windows spec-driven verifier
    # The deep verifier needs Excel (xlwings/COM) and is also slow (~5-7 min)
    # so we do not run it on every push to every feature branch. The plan
    # calls for required-on-main only; feature branches run the Linux `test:`
    # job plus the headless screen, which is the fast feedback path.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      # Spec-driven verifier against the production workbook. The deep
      # verifier reuses build_qc.verify_test_sheets(..., skip_dummy=True)
      # so production sheets are compared against the same Python oracle
      # the QC build uses. --no-launch suppresses the post-build Excel
      # handoff (we are the verifier, not the human). --skip-data-table-
      # calculations avoids the extra CalculateFullRebuild pass since
      # verify_test_sheets already calls Calculate() per sheet.
      - name: Run spec-driven verifier
        env:
          RUN_EXCEL_INTEGRATION: "1"
        run: uv run --frozen python build_production.py --verify --no-launch --skip-data-table-calculations
