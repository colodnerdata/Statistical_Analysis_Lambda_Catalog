name: Refactor log-drop sample mask

on:
  push:
    branches:
      - refactor/log-drop-sample-mask

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/log-drop-sample-mask
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          catalog_path = ROOT / 'lambda_functions.json'
          payload = json.loads(catalog_path.read_text(encoding='utf-8'))
          functions = payload['functions']
          by_name = {item['name']: item for item in functions}

          sample_calc = {
            'name': 'Sample_Include_Calc',
            'category': 'Model Construction',
            'subcategory': 'Sheet-Scoped Constructors',
            'scope': 'Regression',
            'formula_display': '''=LAMBDA(
              LET(
                Number_Of_Columns,COLUMNS(Source_Data),
                Spec_Roles,TAKE(Spec_Role,Number_Of_Columns),
                Spec_Includes,TAKE(Spec_Include,Number_Of_Columns),
                Spec_Types,TAKE(Spec_Type,Number_Of_Columns),
                Initial_Mask,SEQUENCE(ROWS(Source_Data),1,1,0),
                Sample_Mask,
                  REDUCE(
                    Initial_Mask,
                    SEQUENCE(Number_Of_Columns),
                    LAMBDA(Accumulated_Mask,Column_Number,
                      LET(
                        Source_Column,INDEX(Source_Data,0,Column_Number),
                        IF(
                          INDEX(Spec_Roles,Column_Number)="Filter",
                          Accumulated_Mask*--IFERROR((Source_Column+0)=1,FALSE),
                          IF(
                            OR(
                              INDEX(Spec_Roles,Column_Number)="Response (y)",
                              AND(
                                INDEX(Spec_Roles,Column_Number)="Predictor (x)",
                                INDEX(Spec_Includes,Column_Number)=TRUE,
                                INDEX(Spec_Types,Column_Number)="Continuous"
                              )
                            ),
                            Accumulated_Mask*N(ISNUMBER(Source_Column)),
                            Accumulated_Mask
                          )
                        )
                      )
                    )
                  ),
                Sample_Mask=1
              )
            )''',
            'arguments': [],
            'yields': 'A full-height Boolean row mask identifying rows ordinarily eligible for the model before any transform-specific row dropping is applied.',
            'description': 'Sample_Include_Calc is the computational leaf for ordinary model-sample eligibility. It applies only the rules that determine whether a source row is otherwise usable by the declared model. Filter rows must evaluate to 1 or TRUE. The Response (y) and every included Continuous Predictor (x) must contain numeric values.\n\nTransforms do not participate here. In particular, neither "Log" nor "Log (drop ≤ 0)" changes this mask. A strict Log with a zero or negative therefore remains eligible here and is allowed to fail later in Ln_Positive. The explicit dropping behaviour of "Log (drop ≤ 0)" belongs to Log_Drop_Sample_Include_Calc instead.\n\nFull-height by contract: it never row-filters; it returns one Boolean per source row. Filter truthiness coerces with (Source_Column+0), not N(Source_Column), because N() on a bare range reference may implicit-intersect to a scalar.\n\nSHEET-SCOPED (scope: Regression): Source_Data and the Spec_* arrays resolve against the calling sheet.',
            'plain_language_summary': 'Which rows are otherwise usable by the model: Filters pass and all required numeric model variables contain numbers.',
            'notes': 'Ordinary eligibility mask only: Filters + numeric response/included continuous predictors. No transform-driven row dropping.'
          }

          sample_public = {
            'name': 'Sample_Include',
            'category': 'Model Construction',
            'subcategory': 'Sheet-Scoped Constructors',
            'scope': 'Regression',
            'formula_display': '=LAMBDA(\n    Sample_Include_Calc()\n)',
            'arguments': [],
            'yields': 'The ordinary model-sample inclusion mask, before any rows are removed by "Log (drop ≤ 0)".',
            'description': 'Sample_Include is the public ordinary-eligibility mask. It returns Sample_Include_Calc() directly: Filters have been applied and required model variables have been checked for numeric values, but transform-specific row dropping has not occurred.\n\nA plain "Log" transform never changes Sample_Include: zero and negative values remain eligible and subsequently cause Ln_Positive to return #N/A. Likewise, a row that will later be removed under "Log (drop ≤ 0)" is still TRUE here if it otherwise satisfies the model\'s Filters and numeric-data requirements.\n\nThe actual sample entering the regression is exposed separately through Fit_Sample_Include(), whose materialized source is Log_Drop_Sample_Include_Calc(). Keeping those concepts separate makes a call to Sample_Include() mean ordinary sample eligibility rather than silently including transform-specific filtering.\n\nSHEET-SCOPED (scope: Regression); delegates to this sheet\'s Sample_Include_Calc closure.',
            'plain_language_summary': 'The model\'s ordinary eligible rows, before the special "Log (drop ≤ 0)" rule removes anything.',
            'notes': 'Public ordinary-sample mask. No arguments. Transform-driven row dropping is handled separately.'
          }

          log_drop_calc = {
            'name': 'Log_Drop_Sample_Include_Calc',
            'category': 'Model Construction',
            'subcategory': 'Sheet-Scoped Constructors',
            'scope': 'Regression',
            'formula_display': '''=LAMBDA(
              LET(
                Number_Of_Columns,COLUMNS(Source_Data),
                Spec_Roles,TAKE(Spec_Role,Number_Of_Columns),
                Spec_Includes,TAKE(Spec_Include,Number_Of_Columns),
                Spec_Types,TAKE(Spec_Type,Number_Of_Columns),
                Spec_Transforms,TAKE(Spec_Transform,Number_Of_Columns),
                Base_Sample_Mask,Sample_Include_Calc(),
                Log_Drop_Sample_Mask,
                  REDUCE(
                    Base_Sample_Mask,
                    SEQUENCE(Number_Of_Columns),
                    LAMBDA(Accumulated_Mask,Column_Number,
                      LET(
                        Source_Column,INDEX(Source_Data,0,Column_Number),
                        Eligible_Column,
                          OR(
                            INDEX(Spec_Roles,Column_Number)="Response (y)",
                            AND(
                              INDEX(Spec_Roles,Column_Number)="Predictor (x)",
                              INDEX(Spec_Includes,Column_Number)=TRUE,
                              INDEX(Spec_Types,Column_Number)="Continuous"
                            )
                          ),
                        IF(
                          AND(
                            Eligible_Column,
                            INDEX(Spec_Transforms,Column_Number)="Log (drop ≤ 0)"
                          ),
                          Accumulated_Mask*--IFERROR((Source_Column+0)>0,FALSE),
                          Accumulated_Mask
                        )
                      )
                    )
                  ),
                Log_Drop_Sample_Mask=1
              )
            )''',
            'arguments': [],
            'yields': 'The final model-sample mask after ordinary eligibility plus the positivity rule explicitly requested by every eligible "Log (drop ≤ 0)" transform.',
            'description': 'Log_Drop_Sample_Include_Calc adds the one transform-specific row-removal rule supported by the regression spec to the ordinary Sample_Include_Calc mask.\n\nIt begins with Sample_Include_Calc(), so every Filter and required-numeric-data condition has already been applied. It then walks only transform-eligible model columns: the Response (y), and included Continuous Predictor (x) rows. When one of those columns declares exactly "Log (drop ≤ 0)", rows whose value is zero or negative are removed from the mask.\n\nPlain "Log" is intentionally ignored. A strict Log does not modify the sample: a non-positive value remains present and Ln_Positive returns #N/A, causing the fit to fail visibly. This gives the two transform choices distinct semantics — "Log" means transform or fail, while "Log (drop ≤ 0)" means explicitly remove invalid-domain rows and fit the remaining sample.\n\nThis function produces the materialized sample-inclusion spill read by Fit_Sample_Include(). Separating it from Sample_Include_Calc makes the transform-driven sample modification visible in both the function name and dependency graph.\n\nSHEET-SCOPED (scope: Regression).',
            'plain_language_summary': 'Takes the ordinary model sample and removes rows that are non-positive only where "Log (drop ≤ 0)" was explicitly selected.',
            'notes': 'Final-sample leaf: ordinary eligibility plus positivity only for eligible columns declaring Log (drop ≤ 0).'
          }

          log_status = {
            'name': 'Log_Domain_Status',
            'category': 'Model Construction',
            'subcategory': 'Spec Status Readouts',
            'scope': 'Regression',
            'formula_display': '''=LAMBDA(
              LET(
                Number_Of_Columns,COLUMNS(Source_Data),
                Spec_Roles,TAKE(Spec_Role,Number_Of_Columns),
                Spec_Includes,TAKE(Spec_Include,Number_Of_Columns),
                Spec_Types,TAKE(Spec_Type,Number_Of_Columns),
                Spec_Transforms,TAKE(Spec_Transform,Number_Of_Columns),
                Headers,TOROW(Header_Names),
                Base_Sample_Include,Sample_Include(),
                Fitted_Sample_Include,Fit_Sample_Include(),
                Eligible_Columns,((Spec_Roles="Response (y)")+((Spec_Roles="Predictor (x)")*(Spec_Includes=TRUE)*(Spec_Types="Continuous")))>0,
                Strict_Log_Nonpositive_Counts,
                  MAP(
                    SEQUENCE(Number_Of_Columns),
                    LAMBDA(Column_Number,
                      IF(
                        AND(
                          INDEX(Eligible_Columns,Column_Number),
                          INDEX(Spec_Transforms,Column_Number)="Log"
                        ),
                        SUMPRODUCT(
                          --Fitted_Sample_Include,
                          --IFERROR((INDEX(Source_Data,0,Column_Number)+0)<=0,FALSE)
                        ),
                        0
                      )
                    )
                  ),
                Maximum_Strict_Log_Nonpositive_Count,MAX(Strict_Log_Nonpositive_Counts),
                Log_Drop_Excluded_Row_Count,SUMPRODUCT(--Base_Sample_Include)-SUMPRODUCT(--Fitted_Sample_Include),
                IF(
                  Maximum_Strict_Log_Nonpositive_Count>0,
                  LET(
                    Worst_Column_Number,XMATCH(Maximum_Strict_Log_Nonpositive_Count,Strict_Log_Nonpositive_Counts),
                    "ERROR: "&INDEX(Headers,1,Worst_Column_Number)&" has "&Maximum_Strict_Log_Nonpositive_Count&" values ≤ 0 under Log — the fit is #N/A. Use Log (drop ≤ 0)."
                  ),
                  IF(
                    Log_Drop_Excluded_Row_Count=0,
                    "",
                    Log_Drop_Excluded_Row_Count&" row"&IF(Log_Drop_Excluded_Row_Count=1,"","s")&" excluded: Log of ≤ 0"
                  )
                )
              )
            )''',
            'arguments': [],
            'yields': 'An ERROR string naming the variable and non-positive fitted-row count when a strict Log makes the fit invalid; otherwise the number of ordinary eligible rows removed by "Log (drop ≤ 0)"; otherwise "".',
            'description': 'Log_Domain_Status is the G2 readout: what the declared Log transforms are doing to the model and its sample. Two states, most severe first.\n\nRED — an eligible variable declaring strict "Log" contains one or more zero or negative values among the rows that actually reach the fit. Plain Log does not filter those rows, so Ln_Positive returns #N/A and the error propagates through the fit. The message names the first variable with the largest offending-row count and points to "Log (drop ≤ 0)" as the explicit row-dropping alternative.\n\nAMBER — "Log (drop ≤ 0)" has removed otherwise eligible model rows. The count is the difference between Sample_Include(), which represents ordinary eligibility before transform-driven dropping, and Fit_Sample_Include(), the materialized final mask produced from Log_Drop_Sample_Include_Calc(). Because that is the only additional exclusion between those masks, the difference is exactly the number of distinct records removed by the Log-drop rule. A row violating two drop-Log variables counts once.\n\nBlank means neither applies.\n\nSHEET-SCOPED (scope: Regression).',
            'plain_language_summary': 'Reports whether a strict Log makes the fitted model fail, or how many otherwise usable rows "Log (drop ≤ 0)" deliberately removed.',
            'notes': 'G2: RED for fitted strict-Log nonpositives; otherwise AMBER for ordinary eligible rows removed by Log (drop ≤ 0), else blank.'
          }

          # Replace the two existing definitions and insert the explicit final-mask leaf.
          sample_idx = next(i for i, item in enumerate(functions) if item['name'] == 'Sample_Include_Calc')
          public_idx = next(i for i, item in enumerate(functions) if item['name'] == 'Sample_Include')
          status_idx = next(i for i, item in enumerate(functions) if item['name'] == 'Log_Domain_Status')
          functions[sample_idx] = sample_calc
          functions[public_idx] = sample_public
          functions[status_idx] = log_status
          functions[:] = [item for item in functions if item['name'] != 'Log_Drop_Sample_Include_Calc']
          public_idx = next(i for i, item in enumerate(functions) if item['name'] == 'Sample_Include')
          functions.insert(public_idx + 1, log_drop_calc)
          by_name = {item['name']: item for item in functions}

          # Every fit-time constructor needs the final log-drop-aware computational array.
          fit_mask_consumers = {
            'Response_Column',
            'Predictor_Columns',
            'Constructed_Column_Names',
            'Constructed_Column_Transforms',
            'Absorbed_Degrees_Of_Freedom',
            'Design_Response',
            'Design_Columns_Calc',
          }
          for name in fit_mask_consumers:
            formula = by_name[name]['formula_display']
            if 'Sample_Include_Calc()' not in formula:
              raise RuntimeError(f'{name} no longer contains expected Sample_Include_Calc() call')
            by_name[name]['formula_display'] = formula.replace(
              'Sample_Include_Calc()', 'Log_Drop_Sample_Include_Calc()'
            )
            for key in ('description', 'notes'):
              if key in by_name[name] and isinstance(by_name[name][key], str):
                by_name[name][key] = by_name[name][key].replace(
                  'Sample_Include_Calc()', 'Log_Drop_Sample_Include_Calc()'
                )

          catalog_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def replace(path, old, new, count=None):
            p = ROOT / path
            text = p.read_text(encoding='utf-8')
            actual = text.count(old)
            if actual == 0:
              raise RuntimeError(f'{path}: expected text not found: {old[:100]!r}')
            if count is not None and actual != count:
              raise RuntimeError(f'{path}: expected {count} occurrences, found {actual}: {old[:100]!r}')
            p.write_text(text.replace(old, new), encoding='utf-8')

          # Materialize the actual fitted mask from the explicitly named Log-drop leaf.
          replace('lambda_catalog/regression_materialization.py', '"=Sample_Include_Calc()",', '"=Log_Drop_Sample_Include_Calc()",', 1)
          replace('lambda_catalog/regression_materialization.py', '(=Sample_Include_Calc()), NOT the public Sample_Include() name.', '(=Log_Drop_Sample_Include_Calc()), while public Sample_Include() remains the ordinary pre-drop eligibility mask.', 1)

          # The spec block exposes ordinary eligibility in its full-height audit column,
          # but all row-filtered displays and the row-1 count must reflect the fitted sample.
          replace('lambda_catalog/write_spec_block.py', 'val(sheet, _HEADER_ROW, _C_INCLUDED, "Included")', 'val(sheet, _HEADER_ROW, _C_INCLUDED, "Eligible")', 1)
          replace('lambda_catalog/write_spec_block.py', 'f"=IFERROR(FILTER({source},Sample_Include()),"', 'f"=IFERROR(FILTER({source},Fit_Sample_Include()),"', 1)
          replace('lambda_catalog/write_spec_block.py', '("included rows", "=SUMPRODUCT(N(Sample_Include()))"),', '("included rows", "=SUMPRODUCT(--Fit_Sample_Include())"),', 1)

          # Python expectation mirrors: make the boolean's purpose explicit internally and
          # make strict-Log RED inspect the final fitted mask, matching G2.
          for path in ('lambda_catalog/analyze_model_construction.py', 'lambda_catalog/analyze_regression_spec.py', 'lambda_catalog/analyze_regression_guard_states.py'):
            p = ROOT / path
            text = p.read_text(encoding='utf-8').replace('apply_log_domain', 'apply_log_drop')
            text = text.replace('Sample_Include(FALSE)', 'Sample_Include() before Log drop')
            p.write_text(text, encoding='utf-8')
          guard = ROOT / 'lambda_catalog/analyze_regression_guard_states.py'
          text = guard.read_text(encoding='utf-8')
          text = text.replace(
            'base = _compute_mask(list(spec), rows, apply_log_drop=False)',
            'base = _compute_mask(list(spec), rows)'
          )
          guard.write_text(text, encoding='utf-8')

          # Update focused unit expectations for the new dependency graph and worksheet calls.
          test_paths = [
            'tests/test_spec_block_writer.py',
            'tests/test_sheet_writers.py',
            'tests/test_within_estimator.py',
            'tests/test_group_panel_transforms.py',
            'tests/test_catalog_schema.py',
          ]
          for path in test_paths:
            p = ROOT / path
            text = p.read_text(encoding='utf-8')
            text = text.replace('Sample_Include(FALSE)', 'Sample_Include()')
            text = text.replace('=Sample_Include_Calc()', '=Log_Drop_Sample_Include_Calc()')
            text = text.replace('Sample_Include_Calc())', 'Log_Drop_Sample_Include_Calc())')
            text = text.replace('si,Sample_Include_Calc()', 'si,Log_Drop_Sample_Include_Calc()')
            text = text.replace('inc,Sample_Include_Calc()', 'inc,Log_Drop_Sample_Include_Calc()')
            text = text.replace('"Included"', '"Eligible"')
            text = text.replace('FILTER({source},Sample_Include())', 'FILTER({source},Fit_Sample_Include())')
            text = text.replace('=SUMPRODUCT(N(Sample_Include()))', '=SUMPRODUCT(--Fit_Sample_Include())')
            p.write_text(text, encoding='utf-8')

          # Dependency-order assertions need to know the new leaf is installed before consumers.
          p = ROOT / 'tests/test_catalog_schema.py'
          text = p.read_text(encoding='utf-8')
          needle = '"Sample_Include_Calc",\n                "Sample_Include",'
          if needle in text:
            text = text.replace(needle, '"Sample_Include_Calc",\n                "Sample_Include",\n                "Log_Drop_Sample_Include_Calc",')
          p.write_text(text, encoding='utf-8')

          # Keep the architecture-facing source comments truthful where they explicitly name the old API.
          for path in ('lambda_catalog/regression_materialization.py', 'lambda_catalog/write_spec_block.py'):
            p = ROOT / path
            text = p.read_text(encoding='utf-8')
            text = text.replace('Sample_Include(FALSE)', 'Sample_Include()')
            text = text.replace('optional ``apply_log_domain`` argument', 'ordinary pre-drop eligibility semantics')
            p.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -q pytest numpy pandas openpyxl
      - name: Run focused tests
        run: |
          pytest -q \
            tests/test_catalog_schema.py \
            tests/test_spec_block_writer.py \
            tests/test_sheet_writers.py \
            tests/test_within_estimator.py \
            tests/test_group_panel_transforms.py \
            tests/test_regression_spec_qc.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-log-drop-sample-mask.yml
          git add lambda_functions.json lambda_catalog tests
          git commit -m "Refactor Log-drop sample mask semantics"
          git push origin HEAD:refactor/log-drop-sample-mask
