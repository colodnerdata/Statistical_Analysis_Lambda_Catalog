name: Finalize log-drop PR

on:
  push:
    branches:
      - refactor/log-drop-sample-mask

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/log-drop-sample-mask
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final call-site audit
        run: python .github/finalize_log_drop_pr.py
      - name: Install project and test dependencies
        run: python -m pip install -q -e . pytest
      - name: Run focused tests
        run: |
          pytest -q \
            tests/test_catalog_schema.py \
            tests/test_spec_block_writer.py \
            tests/test_sheet_writers.py \
            tests/test_within_estimator.py \
            tests/test_group_panel_transforms.py \
            tests/test_regression_spec_qc.py
      - name: Commit final audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/finalize_log_drop_pr.py .github/workflows/finalize-log-drop-pr.yml
          git add lambda_functions.json lambda_catalog tests
          git commit -m "Align fitted-sample displays with Log-drop mask"
          git push origin HEAD:refactor/log-drop-sample-mask
