[project]
name = "statistical-analysis-lambda-catalog"
version = "0.1.0"
description = "Generate an Excel LAMBDA-function catalog for multilinear regression"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "lxml>=6.0,<7",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pywin32>=306; platform_system == 'Windows'",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "xlwings>=0.33,<1",
]

keywords = ["excel", "lambda", "ols", "regression", "toolpak"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Repository = "https://github.com/colodnerdata/Statistical_Analysis_Lambda_Catalog"
Issues = "https://github.com/colodnerdata/Statistical_Analysis_Lambda_Catalog/issues"

[dependency-groups]
dev = [
  # >=0.48 for the `parallel` task type, which `verify` and `check` both use.
  # An older poe reads a `parallel` key as an unknown task and refuses to run.
  "poethepoet>=0.48,<1",
  "pylint>=3.2,<4",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5.0,<8",
  # tomllib is stdlib from 3.11; tests/test_poe_tasks.py needs the backport on 3.10.
  "tomli>=2.0; python_version < '3.11'",
]

[tool.uv]
default-groups = ["dev"]

[tool.poe.env]
# The Makefile passed `--frozen` on every recipe: fail on a stale lockfile
# rather than silently resolving a new one.  UV_FROZEN is how that intent
# reaches the uv executor without repeating the flag per task.
UV_FROZEN = "1"

[tool.poe.tasks]

# -- Unit tests and static checks (no Excel; these are what CI runs) ---------

[tool.poe.tasks.test]
help = "Run the unit-test suite (no Excel needed)."
cmd = "pytest"

[tool.poe.tasks.test-cov]
help = "Run the unit-test suite with coverage reports. This is the CI step."
cmd = "pytest --cov --cov-report=term-missing --cov-report=xml"

[tool.poe.tasks.test-excel]
help = "Unit suite plus the opt-in real-workbook tests (needs the built artifacts)."
cmd = "pytest tests/test_workbook_invariants.py -v"
env = { RUN_EXCEL_INTEGRATION = "1" }

[tool.poe.tasks.lint]
help = "Run pylint's error-only checks. This is the CI step."
cmd = "pylint --errors-only lambda_catalog scripts tools"

# The pair CI runs, concurrently, for a local pre-push screen. CI keeps them as
# separate jobs rather than calling this task -- it wants two independently
# reportable checks, not one combined pass/fail.
[tool.poe.tasks.check]
help = "Run the coverage suite and the linter together, in parallel."
parallel = ["test-cov", "lint"]

# -- Verification ------------------------------------------------------------
#
# Layer 1 (verify-headless): pure zipfile + lxml structural check, runs on
# Linux in <1 s.  Catches packaging regressions: dangling defined names,
# broken Content_Types / workbook.xml.rels, orphan chart relationships,
# #REF!/#NAME? cached values, sheet drift.
#
# Layer 2 (verify-deep*, verify-test-models): spec-driven xlwings checks that
# require desktop Excel.  Not run in CI — the GitHub-hosted windows-latest
# image has no Microsoft Office, so xlwings cannot dispatch Excel.Application.
#
# `verify` runs both layers; verify-headless is the fast screen, the deep
# checks are the source of truth.  See CONTRIBUTING.md -> "Verifying builds".
#
# ORDER MATTERS, and it used to be wrong.  verify-headless reads the artifacts
# sitting in dist/; the deep tasks REBUILD those same files.  With the screen
# running first it therefore screened the previously committed artifacts and
# never saw what the run had just produced -- a rebuild that broke a defined
# name or orphaned a chart relationship passed `verify` cleanly.  The builds
# now run first and the screen runs last, over their output.

[tool.poe.tasks.verify-headless]
help = "Layer 1: fast zipfile/lxml invariant screen (<1 s, no Excel)."
cmd = "pytest tests/test_workbook_invariants.py -v"

# Both deep-verify tasks tee their whole run — the VerifyReport on drift,
# stderr, and the traceback of anything that aborts the build — to
# "excel-only-runs/<script> <flags>.log".  Since neither can run in CI, that
# file is the only thing a reviewer or a future agent has to read a failure
# from; commit it on the branch that produced it.  `--log PATH` overrides the
# destination.
[tool.poe.tasks.verify-deep]
help = "Layer 2: build + spec-verify the Regression workbook (needs Excel)."
cmd = "python scripts/build_production.py --verify --no-launch"

[tool.poe.tasks.verify-deep-univariate]
help = "Layer 2: build + spec-verify the Univariate workbook (needs Excel)."
cmd = "python scripts/build_univariate.py --verify --no-launch"

# --verbose because this one runs for minutes over ~48 sheets: it names each
# sheet BEFORE writing it, so an interrupted run leaves the offending case on
# screen.  The whole transcript is archived to "excel-only-runs/" either way,
# stderr included, so a com_error traceback is a file somebody can hand over
# rather than a terminal scrollback.  The heavy L08 case is excluded by
# default; pass --include-heavy for it (its Python oracle runs in the unit
# suite regardless).
[tool.poe.tasks.verify-test-models]
help = "Layer 2: build + read back the ~48-sheet test-model suite (needs Excel)."
cmd = "python scripts/build_test_models.py --verify --no-launch --verbose"

# The three builds run CONCURRENTLY, then the screen runs over their output.
#
# They are safe to overlap because nothing is shared: each driver opens its own
# `xw.App(visible=False, add_book=False)` and reaches every workbook through
# that instance's `app.books` handle -- there is no `xw.Book()` or
# `xw.apps.active` anywhere in lambda_catalog/, scripts/ or tools/, so no
# driver can bind to a sibling's Excel.  They write three different files and
# three differently-named transcripts.  The one file two of them could have
# contended over is templates/static_sheets.xlsx, which `copy_static_sheet`
# now opens read-only.
#
# `output_mode = "buffer"` holds each driver's output and prints it as one
# block when that driver finishes.  Interleaved streaming would shred exactly
# the transcripts excel-only-runs/ exists to preserve.
#
# Wall time becomes roughly the longest build (verify-test-models, minutes)
# instead of the sum of all three.  The cost is three Excel instances
# competing for CPU: on a constrained machine, run the three verify-* tasks
# individually instead.  Nothing here can be checked by CI -- no GitHub-hosted
# runner has Office -- so a change to this block needs a developer-machine run
# archived to excel-only-runs/.
[tool.poe.tasks.verify]
help = "Both layers, both artifacts, plus the test-model suite (needs Excel)."
sequence = [
  { parallel = ["verify-deep", "verify-deep-univariate", "verify-test-models"], output_mode = "buffer" },
  "verify-headless",
]

# -- Builds (all need Excel) -------------------------------------------------

[tool.poe.tasks.build]
help = "Build the distributable Regression workbook, dist/Lambda_Library.xlsx."
cmd = "python scripts/build_production.py"

[tool.poe.tasks.build-univariate]
help = "Build dist/Lambda_Library_Univariate.xlsx."
cmd = "python scripts/build_univariate.py"

[tool.poe.tasks.static-sheets]
help = "Regenerate every static reference sheet into templates/static_sheets.xlsx."
cmd = "python scripts/rebuild_static_sheets.py"

[tool.poe.tasks.resync-names]
help = "Re-apply the workbook-scope name cleanup to a built artifact. Takes workbook paths."
cmd = "python tools/resync_workbook_names.py"

[tool.mypy]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lambda_catalog"]

[tool.hatch.build.targets.sdist]
include = [
  "/scripts",
  "/lambda_catalog",
  "/sample_data",
  "/tests",
  "/tools",
  "/README.md",
  "/CONTRIBUTING.md",
  "/lambda_functions.json",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.main]
extension-pkg-allow-list = ["lxml"]

[tool.pylint.messages_control]
# The workbook writers deliberately mirror Excel's COM API, keep lazy imports
# to avoid starting Excel during module import, and contain large declarative
# formula/layout routines.  Pylint's generic API-size and complexity defaults
# are therefore not useful quality gates for this project.  Tests also use
# explicit empty-container comparisons and lightweight COM recording doubles.
disable = [
  "broad-exception-caught",
  "consider-using-enumerate",
  "consider-using-from-import",
  "consider-using-with",
  "duplicate-code",
  "import-outside-toplevel",
  "inconsistent-return-statements",
  "invalid-name",
  "line-too-long",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "mixed-line-endings",
  "multiple-statements",
  "protected-access",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-statements",
  "use-implicit-booleaness-not-comparison",
  "use-maxsplit-arg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--tb=short"]

[tool.coverage.run]
source = ["lambda_catalog"]
omit = [
  # An explicit list of exceptions, not a rule with an inferable boundary.
  # Sixteen modules import xlwings and only these are omitted: workbook_builder
  # (87 %), build_common (92 %) and analyze_model_construction (76 %) are all
  # measured, because the RecordingSheet COM double exercises most of what they
  # do without Excel.  Coverage is not the boundary either -- omitted
  # write_sheet_version_history reports 100 %, measured regression_spec_sheet_io
  # reports 43 %.  So do not try to derive membership; read the list.
  #
  # The one thing that IS a rule, and the one this PR enforced, is negative:
  # a module that imports neither xlwings nor pywin32 does not belong here at
  # all.  Four were listed under the old comment's looser "is about the
  # workbook" reading despite importing neither, and measured 92 / 87 / 100 /
  # 48 % the moment they were let back in -- worst of them
  # analyze_regression_sheet.py, the live spec oracle's OLS core
  # (analyze_regression_spec calls calculate_regression_results_from_matrix),
  # so the headline number was excluding the arithmetic under test.
  #
  # The writers stay as one glob rather than nine entries: their coverage
  # varies (23 % to 100 %) with how much of each is RecordingSheet-reachable,
  # but they are one family with one reason to be here, and per-file entries
  # would be nine things to maintain instead of one.
  "lambda_catalog/workbook_helpers.py",
  "lambda_catalog/write_sheet_*.py",
  "lambda_catalog/deep_verify.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
