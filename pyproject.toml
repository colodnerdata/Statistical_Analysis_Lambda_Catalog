[project]
name = "statistical-analysis-lambda-catalog"
version = "0.1.0"
description = "Generate an Excel LAMBDA-function catalog for multilinear regression"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "lxml>=6.0,<7",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pywin32>=306; platform_system == 'Windows'",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "xlwings>=0.33,<1",
]

keywords = ["excel", "lambda", "ols", "regression", "toolpak"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Repository = "https://github.com/colodnerdata/Statistical_Analysis_Lambda_Catalog"
Issues = "https://github.com/colodnerdata/Statistical_Analysis_Lambda_Catalog/issues"

[dependency-groups]
dev = [
  "poethepoet>=0.30,<1",
  "pylint>=3.2,<4",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5.0,<8",
  # tomllib is stdlib from 3.11; tests/test_poe_tasks.py needs the backport on 3.10.
  "tomli>=2.0; python_version < '3.11'",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Task runner (poethepoet).  Replaces the old Makefile so the shorthands work
# on any machine without GNU make: `uv tool install poethepoet` once, then
# `poe <task>` anywhere in the repo.  `uv run poe <task>` needs no global
# install at all, since poethepoet is in the dev group above.
#
# poethepoet is NOT a Poetry tool despite the name — it detects `[tool.uv]` /
# `uv.lock` above and runs every task inside the uv-managed environment, so no
# task needs a `uv run` prefix of its own.
#
# Run bare `poe` to list every task with its help text.
# ---------------------------------------------------------------------------
[tool.poe.env]
# The Makefile passed `--frozen` on every recipe: fail on a stale lockfile
# rather than silently resolving a new one.  UV_FROZEN is how that intent
# reaches the uv executor without repeating the flag per task.
UV_FROZEN = "1"

[tool.poe.tasks]

# -- Unit tests and static checks (no Excel; these are what CI runs) ---------

[tool.poe.tasks.test]
help = "Run the unit-test suite (no Excel needed)."
cmd = "pytest"

[tool.poe.tasks.test-cov]
help = "Run the unit-test suite with coverage reports. This is the CI step."
cmd = "pytest --cov --cov-report=term-missing --cov-report=xml"

[tool.poe.tasks.test-excel]
help = "Unit suite plus the opt-in real-workbook tests (needs the built artifacts)."
cmd = "pytest tests/test_workbook_invariants.py -v"
env = { RUN_EXCEL_INTEGRATION = "1" }

[tool.poe.tasks.lint]
help = "Run pylint's error-only checks. This is the CI step."
cmd = "pylint --errors-only lambda_catalog scripts tools"

# -- Verification ------------------------------------------------------------
#
# Layer 1 (verify-headless): pure zipfile + lxml structural check, runs on
# Linux in <1 s.  Catches packaging regressions: dangling defined names,
# broken Content_Types / workbook.xml.rels, orphan chart relationships,
# #REF!/#NAME? cached values, sheet drift.
#
# Layer 2 (verify-deep*, verify-test-models): spec-driven xlwings checks that
# require desktop Excel.  Not run in CI — the GitHub-hosted windows-latest
# image has no Microsoft Office, so xlwings cannot dispatch Excel.Application.
#
# `verify` runs both layers; verify-headless is the fast screen, the deep
# checks are the source of truth.  See CONTRIBUTING.md -> "Verifying builds".

[tool.poe.tasks.verify-headless]
help = "Layer 1: fast zipfile/lxml invariant screen (<1 s, no Excel)."
cmd = "pytest tests/test_workbook_invariants.py -v"

# Both deep-verify tasks tee their whole run — the VerifyReport on drift,
# stderr, and the traceback of anything that aborts the build — to
# "excel-only-runs/<script> <flags>.log".  Since neither can run in CI, that
# file is the only thing a reviewer or a future agent has to read a failure
# from; commit it on the branch that produced it.  `--log PATH` overrides the
# destination.
[tool.poe.tasks.verify-deep]
help = "Layer 2: build + spec-verify the Regression workbook (needs Excel)."
cmd = "python scripts/build_production.py --verify --no-launch"

[tool.poe.tasks.verify-deep-univariate]
help = "Layer 2: build + spec-verify the Univariate workbook (needs Excel)."
cmd = "python scripts/build_univariate.py --verify --no-launch"

# --verbose because this one runs for minutes over ~48 sheets: it names each
# sheet BEFORE writing it, so an interrupted run leaves the offending case on
# screen.  The whole transcript is archived to "excel-only-runs/" either way,
# stderr included, so a com_error traceback is a file somebody can hand over
# rather than a terminal scrollback.  The heavy L08 case is excluded by
# default; pass --include-heavy for it (its Python oracle runs in the unit
# suite regardless).
[tool.poe.tasks.verify-test-models]
help = "Layer 2: build + read back the ~48-sheet test-model suite (needs Excel)."
cmd = "python scripts/build_test_models.py --verify --no-launch --verbose"

[tool.poe.tasks.verify]
help = "Both layers, both artifacts, plus the test-model suite (needs Excel)."
sequence = ["verify-headless", "verify-deep", "verify-deep-univariate", "verify-test-models"]

# -- Builds (all need Excel) -------------------------------------------------

[tool.poe.tasks.build]
help = "Build the distributable Regression workbook, dist/Lambda_Library.xlsx."
cmd = "python scripts/build_production.py"

[tool.poe.tasks.build-univariate]
help = "Build dist/Lambda_Library_Univariate.xlsx."
cmd = "python scripts/build_univariate.py"

[tool.poe.tasks.qc]
help = "Build the QC workbook and run the full expected-vs-actual pass."
cmd = "python scripts/build_qc.py"

[tool.poe.tasks.static-sheets]
help = "Regenerate every static reference sheet into templates/static_sheets.xlsx."
cmd = "python scripts/rebuild_static_sheets.py"

[tool.poe.tasks.resync-names]
help = "Re-apply the workbook-scope name cleanup to a built artifact. Takes workbook paths."
cmd = "python tools/resync_workbook_names.py"

[tool.mypy]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lambda_catalog"]

[tool.hatch.build.targets.sdist]
include = [
  "/scripts",
  "/lambda_catalog",
  "/sample_data",
  "/tests",
  "/tools",
  "/README.md",
  "/CONTRIBUTING.md",
  "/lambda_functions.json",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.main]
extension-pkg-allow-list = ["lxml"]

[tool.pylint.messages_control]
# The workbook writers deliberately mirror Excel's COM API, keep lazy imports
# to avoid starting Excel during module import, and contain large declarative
# formula/layout routines.  Pylint's generic API-size and complexity defaults
# are therefore not useful quality gates for this project.  Tests also use
# explicit empty-container comparisons and lightweight COM recording doubles.
disable = [
  "broad-exception-caught",
  "consider-using-enumerate",
  "consider-using-from-import",
  "consider-using-with",
  "duplicate-code",
  "import-outside-toplevel",
  "inconsistent-return-statements",
  "invalid-name",
  "line-too-long",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "mixed-line-endings",
  "multiple-statements",
  "protected-access",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-statements",
  "use-implicit-booleaness-not-comparison",
  "use-maxsplit-arg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--tb=short"]

[tool.coverage.run]
source = ["lambda_catalog"]
omit = [
  # xlwings-dependent workbook writers cannot run without Excel on Windows
  "lambda_catalog/workbook_builder.py",
  "lambda_catalog/workbook_helpers.py",
  "lambda_catalog/make_test_sheet.py",
  "lambda_catalog/sheet_styles.py",
  "lambda_catalog/write_sheet_*.py",
  "lambda_catalog/inspection_compare.py",
  "lambda_catalog/analyze_regression_sheet.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
